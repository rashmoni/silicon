<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silicon</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
  <div class="container header-inner">

    <a href="#" class="logo">
      <img src="images/logo.svg" alt="">
      <span>Silicon</span>
    </a>

    <div class="header-actions">
      <span class="theme-label">Dark Mode</span>

      <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>

      <a href="#" class="btn-signin">Sign in / up</a>
    </div>

  </div>
</header>

  <section class="hero">
    <div class="container hero-inner"></div>
  <div class="container">
  <div class="hero-text">
    <h1>Manage All Your Money in One App</h1>
    <p>
      We offer you a personal loan with the best terms.
      Save, spend and manage money in your pocket.
    </p>

    <div class="hero-buttons">
      <a href="#"><img src="images/appstore.png" alt="Download on the App Store"></a>
      <a href="#"><img src="images/googleplay.png" alt="Get it on Google Play"></a>
    </div>
  </div>
  <div class="hero-image">
    <img src="images/phone.png" alt="Silicon app shown on a phone">
  </div>
  </div>

  </section>

</body>
</html>
